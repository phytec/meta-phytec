pcm.dsnoop_pebb006 {
    type dsnoop
    ipc_key 5778293
    slave.pcm "hw:0,0"
}

pcm.dmix_pebb006 {
    type dmix
    ipc_key 5778294
    slave.pcm "hw:0,0"
}

pcm.playback_mono {
    type route
    slave.pcm "dmix_pebb006"
    slave.channels 2
    ttable.0.0 1
    ttable.0.1 1
}

pcm.capture_mono {
    type route
    slave.pcm "dsnoop_pebb006"
    slave.channels 2
    ttable.0.0 1
}

pcm.!default {
    type asym
    playback.pcm "playback_mono"
    capture.pcm "capture_mono"
}

ctl.!default {
    type hw
    card 0
}
