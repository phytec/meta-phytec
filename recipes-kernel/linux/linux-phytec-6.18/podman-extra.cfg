# Additions to the kernel-cache cfg/docker.scc feature.

# netavark/CNI unconditionally tag their iptables rules with
# "-m comment"; multiport is used for published port ranges.
CONFIG_NETFILTER_XT_MATCH_COMMENT=m
CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m

# Optional in moby's check-config.sh but checked by our container tests.
CONFIG_IP_NF_TARGET_REDIRECT=m
CONFIG_IP_VS=m
CONFIG_IP_VS_PROTO_TCP=y
CONFIG_IP_VS_PROTO_UDP=y
CONFIG_IP_VS_NFCT=y
CONFIG_IP_VS_RR=m
CONFIG_CFS_BANDWIDTH=y
CONFIG_BLK_DEV_THROTTLING=y
